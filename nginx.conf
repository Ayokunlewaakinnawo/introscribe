server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /download {
    try_files /index.html =404;
  }

  location = /download/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|mp4|xml|txt|yml|zip|dmg|pkg|exe|blockmap)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
  }
}
